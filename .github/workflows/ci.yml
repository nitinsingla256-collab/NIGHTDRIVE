name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate engine & hosts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Engine, hosts & asset checks
        run: npm test
      - name: Python hosts compile
        run: python3 -m py_compile hosts/linux/nightdrive.py hosts/macos/build_macos.py
      - name: Shell scripts
        run: bash -n hosts/linux/install-linux.sh
      - name: XML host files parse
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          for f in ["hosts/windows/NightdriveHost/NightdriveHost.csproj",
                    "hosts/windows/NightdriveHost/App.xaml",
                    "hosts/windows/NightdriveHost/MainWindow.xaml",
                    "hosts/windows/NightdriveHost/app.manifest"]:
              ET.parse(f)
              print("ok", f)
          PY

  windows-host:
    name: Build Windows host
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build NightdriveHost (Release)
        working-directory: hosts/windows/NightdriveHost
        run: dotnet build NightdriveHost.csproj -c Release
      - name: Publish NightdriveHost & verify bundled engine assets
        working-directory: hosts/windows/NightdriveHost
        shell: pwsh
        run: |
          dotnet publish NightdriveHost.csproj -c Release -r win-x64 --self-contained false -o publish-verify
          $expected = @(
            "publish-verify/NightdriveHost.exe",
            "publish-verify/engine/index.html",
            "publish-verify/engine/script.js",
            "publish-verify/engine/app.js",
            "publish-verify/engine/styles.css",
            "publish-verify/engine/sw.js",
            "publish-verify/engine/assets/ridges.json",
            "publish-verify/engine/assets/studio-catalog.json",
            "publish-verify/engine/assets/morning/scene.jpg",
            "publish-verify/engine/assets/day/scene.jpg",
            "publish-verify/engine/assets/golden-hour/scene.jpg",
            "publish-verify/engine/assets/dusk/scene.jpg",
            "publish-verify/engine/assets/night/scene.jpg",
            "publish-verify/engine/assets/midnight/scene.jpg",
            "publish-verify/engine/assets/night/headlights.jpg",
            "publish-verify/engine/assets/library/alpine-dawn.jpg",
            "publish-verify/engine/assets/cars/obsidian-muscle-coupe.png"
          )
          foreach ($path in $expected) {
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Missing published asset: $path"
            }
          }
          Write-Host "Verified $($expected.Count) published Windows host & engine files."
