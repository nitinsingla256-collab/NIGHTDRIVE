[package]
name = "nightdrive-host"
version = "1.0.0"
description = "Cross-platform host for NIGHTDRIVE"
authors = ["you"]
license = ""
repository = ""
default-run = "nightdrive-host"
edition = "2021"
rust-version = "1.59"

[build-dependencies]
tauri-build = { version = "1.5.0", features = [] }

[dependencies]
tauri = { version = "1.5.0", features = ["shell-all"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.24.1"

[features]
custom-protocol = ["tauri/custom-protocol"]
