[package]
name = "nightdrive-host"
version = "1.1.0"
description = "Cross-platform desktop host for NIGHTDRIVE"
authors = ["nitinsingla256-collab"]
license = ""
repository = "https://github.com/nitinsingla256-collab/NIGHTDRIVE"
default-run = "nightdrive-host"
edition = "2021"
rust-version = "1.60"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = ["shell-open"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.24.1"

[features]
custom-protocol = ["tauri/custom-protocol"]
